name: PHP

env:
  COMPOSE_USER: runner

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  coding-standards:
    name: PHP - Check Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          docker compose run --rm phpfpm composer install
          docker compose run --rm phpfpm vendor/bin/php-cs-fixer fix --dry-run --diff

  phpstan:
    # Analysed on the highest supported PHP, not the default 8.3 service: Symfony 8.1
    # requires PHP >= 8.4.1, so on 8.3 composer cannot install the Symfony 8 that
    # composer.json advertises and the analysis never sees it. phpstan.neon pins the
    # analysis to the declared php ^8.3 range, so the floor stays protected from here.
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          docker compose run --rm phpfpm85 composer install
          docker compose run --rm phpfpm85 vendor/bin/phpstan

  phpstan-lowest:
    # The declared dependency floor, analysed with current dev tooling. A plain
    # --prefer-lowest also downgrades PHPUnit and phpstan-phpunit, and then nearly
    # every error reported is an artefact of that rather than a statement about
    # Symfony 6.4 — 29 of 30, when this was measured. Lowering only what `require`
    # names keeps the analysis about the runtime the bundle claims to support.
    #
    # Runs on the PHP floor too, in the default 8.3 service, as the counterpart to the
    # phpstan job's ceiling on 8.5.
    #
    # Analysis only: lowering the runtime packages drags shared Symfony components
    # (finder, console) down with them, and php-cs-fixer built on those emits nonsense
    # such as `previous : $e`. Never add a formatter to this job, and do not reuse the
    # resulting vendor/ for anything but PHPStan.
    name: PHPStan (lowest runtime dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          docker compose run --rm phpfpm composer install
          docker compose run --rm phpfpm sh -c \
            'composer update --prefer-lowest --with-all-dependencies $(composer show --direct --no-dev --name-only)'
          docker compose run --rm phpfpm vendor/bin/phpstan

  unit-tests:
    name: Unit tests (${{ matrix.php }}, ${{ matrix.prefer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: phpfpm
            php: "8.3"
            prefer: prefer-lowest
          - service: phpfpm
            php: "8.3"
            prefer: prefer-stable
          - service: phpfpm84
            php: "8.4"
            prefer: prefer-lowest
          - service: phpfpm84
            php: "8.4"
            prefer: prefer-stable
          - service: phpfpm85
            php: "8.5"
            prefer: prefer-lowest
          - service: phpfpm85
            php: "8.5"
            prefer: prefer-stable
    steps:
      - uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          docker compose run --rm -e XDEBUG_MODE=coverage ${{ matrix.service }} composer update --${{ matrix.prefer }}
          docker compose run --rm -e XDEBUG_MODE=coverage ${{ matrix.service }} vendor/bin/phpunit --coverage-clover=coverage/unit.xml

      - name: Upload coverage to Codecov
        if: matrix.service == 'phpfpm' && matrix.prefer == 'prefer-stable'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/unit.xml
          # Coverage upload is informational; a Codecov outage (e.g. its CLI
          # binary's GPG signature endpoint failing) must not fail the build.
          fail_ci_if_error: false
          flags: unittests

  mutation-tests:
    name: Mutation tests (${{ matrix.php }}, ${{ matrix.prefer }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: phpfpm
            php: "8.3"
            prefer: prefer-stable
    steps:
      - uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      # The GITHUB_* variables are passed into the container so Infection's
      # CI detection works: --logger-github emits inline PR annotations for
      # escaped mutants, and the Stryker dashboard logger (configured in
      # infection.json5) publishes the report on pushes to develop. The
      # minimum mutation score is enforced via minCoveredMsi in
      # infection.json5.
      - name: Run Infection
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          docker compose run --rm ${{ matrix.service }} composer install
          docker compose run --rm \
            -e XDEBUG_MODE=coverage \
            -e GITHUB_ACTIONS \
            -e GITHUB_REF \
            -e GITHUB_HEAD_REF \
            -e GITHUB_SHA \
            -e GITHUB_REPOSITORY \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_RUN_ID \
            -e GITHUB_SERVER_URL \
            -e STRYKER_DASHBOARD_API_KEY \
            ${{ matrix.service }} vendor/bin/infection --logger-github
