# config/services.yaml
services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # Point `logging_options.logger` at this to turn the bundle's logging off.
  # Symfony's own `logger` service is always present, so there is no "no logger"
  # state to fall back to.
  itkdev_openid_connect.null_logger:
    class: Psr\Log\NullLogger

  ItkDev\OpenIdConnectBundle\Log\AuthenticationAuditLogger:
    public: true
    arguments:
      $enabled: ~
      $identifierMode: ~
    tags:
      # A channel of its own: the audit trail must survive an operational
      # threshold of `error`, which would otherwise discard all of it.
      - { name: monolog.logger, channel: openid_connect_audit }

  # Removed from the container entirely when audit_options.enabled is false, so a
  # deployment that has not opted in does no event handling and assembles no
  # personal data.
  ItkDev\OpenIdConnectBundle\EventSubscriber\AuthenticationAuditSubscriber:
    public: true

  ItkDev\OpenIdConnectBundle\Security\OpenIdConfigurationProviderManager:
    public: true
    arguments:
      $config: ~

  ItkDev\OpenIdConnectBundle\Controller\LoginController:
    public: true
    tags:
      # Routes this bundle's logs to a dedicated Monolog channel so consumers can
      # filter or alert on them. Inert when MonologBundle is not installed.
      - { name: monolog.logger, channel: openid_connect }

  ItkDev\OpenIdConnectBundle\Security\OpenIdLoginAuthenticator:
    public: true
    tags:
      - { name: monolog.logger, channel: openid_connect }

  ItkDev\OpenIdConnectBundle\Util\CliLoginHelper:
    public: true
    arguments:
      $cache: ~

  ItkDev\OpenIdConnectBundle\Command\UserLoginCommand:
    public: true
    arguments:
      $cliLoginHelper: '@ItkDev\OpenIdConnectBundle\Util\CliLoginHelper'
      $cliLoginRoute: ~

  ItkDev\OpenIdConnectBundle\Security\CliLoginTokenAuthenticator:
    public: true
    arguments:
      $cliLoginHelper: '@ItkDev\OpenIdConnectBundle\Util\CliLoginHelper'
      $cliLoginRoute: ~
    tags:
      - { name: monolog.logger, channel: openid_connect }
