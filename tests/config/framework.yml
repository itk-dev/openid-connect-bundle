framework:
  # Needed by audit_options.identifier: hashed, which keys its HMAC on it.
  secret: "test-app-secret"
  cache:
    pools:
      cache.array:
        default_lifetime: 0
        adapters:
          - cache.adapter.array
  test: true
  session:
    handler_id: session.handler.native_file
  form: false
  csrf_protection: false
  validation:
    enabled: false
  esi:
    enabled: false
  workflows:
    enabled: false
  translator:
    enabled: false
  router:
    resource: ~
